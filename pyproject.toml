[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deforestation-pipeline"
version = "0.1.0"
description = "Pipeline reproducible de evidencia geoespacial para cadenas bovinas y EUDR."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "earthengine-api>=1.7.35,<1.8",
    "geopandas>=1.1,<2",
    "geemap>=0.36,<1",
    "joblib>=1.5,<2",
    "matplotlib>=3.10,<4",
    "numpy>=2.3,<3",
    "pillow>=11,<13",
    "pydantic>=2.12,<3",
    "pyproj>=3.7,<4",
    "pyogrio>=0.11,<1",
    "pyyaml>=6,<7",
    "rasterio>=1.4,<2",
    "scikit-learn>=1.7,<2",
    "shapely>=2.1,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
    "types-pyyaml>=6,<7",
    "types-shapely>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deforestation_pipeline"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = [
    "geopandas",
    "geopandas.*",
    "geemap",
    "geemap.*",
    "joblib",
    "pandas",
    "pandas.*",
    "pyogrio",
    "pyogrio.*",
    "rasterio",
    "rasterio.*",
    "sklearn",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = [
    "--cov=deforestation_pipeline",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
