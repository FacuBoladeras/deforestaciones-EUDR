  - dataset_id: "hls_s30_v2"
    provider: "NASA LP DAAC"
    collection: "NASA/HLS/HLSS30/v002"
    version: "2.0"
    license: "NASA full and open data sharing"
    access_date: 2026-07-24
    attribution: >-
      Contains modified Harmonized Landsat Sentinel-2 HLSS30 v2.0 data
      provided by NASA LP DAAC.
    restrictions:
      - >-
        Earth Engine platform terms and project registration apply
        separately from the source data terms.
