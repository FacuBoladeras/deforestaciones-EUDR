[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deforestation-domain"
version = "0.1.0"
description = "Reglas geoespaciales livianas compartidas por API y pipeline EUDR."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "pyproj>=3.7,<4",
    "shapely>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deforestation_domain"]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
]

[tool.pytest.ini_options]
addopts = [
    "--cov=deforestation_domain",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
