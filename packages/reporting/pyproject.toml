[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deforestation-reporting"
version = "0.14.0"
description = "Render determinístico de informes cliente desde report_assets verificados."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=11,<13",
    "pydantic>=2.12,<3",
    "reportlab>=4.4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deforestation_reporting"]

[dependency-groups]
dev = [
    "pypdf>=6.7,<7",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
]

[tool.pytest.ini_options]
addopts = [
    "--cov=deforestation_reporting",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
