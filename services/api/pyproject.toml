[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deforestation-api"
version = "0.2.0"
description = "API interna asíncrona para el pipeline de evidencia EUDR."
requires-python = ">=3.12,<3.13"
dependencies = [
    "deforestation-domain",
    "deforestation-jobs",
    "fastapi>=0.141,<1",
    "pydantic>=2.12,<3",
    "shapely>=2.1,<3",
    "uvicorn>=0.52,<1",
]

[project.scripts]
deforestation-api = "deforestation_api.__main__:main"

[tool.uv.sources]
deforestation-domain = { workspace = true }
deforestation-jobs = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/deforestation_api"]

[dependency-groups]
dev = [
    "httpx2>=2.10,<3",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
]

[tool.pytest.ini_options]
addopts = [
    "--cov=deforestation_api",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
